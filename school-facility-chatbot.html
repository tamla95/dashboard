<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학교시설공사 매뉴얼 AI 챗봇</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f7fb;color:#10233f}
    .loading{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    .card{background:#fff;border:1px solid #dbe3ef;border-radius:18px;padding:28px 34px;box-shadow:0 14px 40px rgba(16,35,63,.10)}
    .spin{width:34px;height:34px;border:4px solid #dbe3ef;border-top-color:#2f63d8;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loading"><div class="card"><div class="spin"></div><strong>학교시설공사 AI 챗봇을 불러오는 중입니다.</strong></div></div>
  <script>
    (async () => {
      try {
        const urls = Array.from({length:6}, (_,i) => `chatbot_parts/part${i}.txt`);
        const parts = await Promise.all(urls.map(async url => {
          const r = await fetch(url, {cache:'no-store'});
          if (!r.ok) throw new Error(`${url} 로드 실패 (${r.status})`);
          return (await r.text()).trim();
        }));
        const b64 = parts.join('');
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
        if (!('DecompressionStream' in window)) throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다. 최신 Chrome 또는 Edge에서 열어주세요.');
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html = await new Response(stream).text();
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        document.body.innerHTML = `<div class="loading"><div class="card"><strong>페이지를 불러오지 못했습니다.</strong><p>${String(e.message || e)}</p></div></div>`;
      }
    })();
  </script>
</body>
</html>
